name: Validate FDM extension

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python bridge
        run: python -m py_compile plugin/python/fdm_bridge.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check plugin/common.js
          node --check plugin/parser.js
          node --check plugin/msparser.js
      - name: FDA packaging smoke test
        run: |
          bash build/build.sh
          python - <<'PY'
          import json, pathlib, zipfile
          version = json.loads(pathlib.Path("plugin/manifest.json").read_text())["version"]
          target = pathlib.Path(f"FTGirl-DDL-FDM-v{version}.fda")
          with zipfile.ZipFile(target) as pkg:
              files = set(pkg.namelist())
              assert "manifest.json" in files
              assert "python/fdm_bridge.py" in files
              assert "msparser.js" in files
              assert pkg.testzip() is None
          print("FDA archive verified:", target)
          PY

  windows-dependencies:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests on Windows
        run: python -m unittest discover -s tests -v
      - name: Install dependencies with unusable pip cache
        shell: pwsh
        run: |
          @'
          import os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path("plugin/python").resolve()))
          import fdm_bridge as bridge
          with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as tmp:
              root = Path(tmp)
              blocked = root / "blocked-pip-cache"
              blocked.write_text("not a directory", encoding="utf-8")
              os.environ["PIP_CACHE_DIR"] = str(blocked)
              bridge.DEPENDENCY_DIR = root / "deps"
              bridge.ensure_zendriver()
              bridge.ensure_crypto_aes()
              assert blocked.is_file()
              print("Dependency installation succeeded without shared cache.")
              import asyncio, base64, hashlib, json, zlib
              from unittest.mock import patch
              key = bytes(range(1, 33))
              n = int.from_bytes(key, "big")
              encoded = ""
              while n:
                  n, rem = divmod(n, 58)
                  encoded = bridge.BASE58_ALPHABET[rem] + encoded
              iv, salt = bytes(range(16)), b"test-slt"
              b64 = lambda b: base64.b64encode(b).decode("ascii")
              adata = [[b64(iv), b64(salt), 10000, 256, 128, "aes", "gcm", "zlib"], "plaintext", 0, 0]
              derived = hashlib.pbkdf2_hmac("sha256", key, salt, 10000, dklen=32)
              aes = bridge.ensure_crypto_aes()
              cipher = aes.new(derived, aes.MODE_GCM, nonce=iv)
              cipher.update(json.dumps(adata, separators=(",", ":")).encode())
              urls = ["https://fuckingfast.co/test1#fixture.part01.rar", "https://fuckingfast.co/test2#fixture.part02.rar"]
              compressor = zlib.compressobj(wbits=-zlib.MAX_WBITS)
              plaintext = json.dumps({"paste": "\n".join(urls)}).encode()
              ciphertext, tag = cipher.encrypt_and_digest(compressor.compress(plaintext) + compressor.flush())
              payload = {"status": 0, "adata": adata, "ct": b64(ciphertext + tag)}
              with patch.object(bridge, "fetch_privatebin_json", return_value=payload), patch.object(bridge, "start_browser", side_effect=AssertionError("browser launched")):
                  result = asyncio.run(bridge.resolve_source("https://paste.fitgirl-repacks.site/?0000000000000000#" + encoded))
              assert [item["source_url"] for item in result["items"]] == urls
              assert all("direct_url" not in item for item in result["items"])
              print("Synthetic encrypted playlist returned two selectable files.")
          '@ | python -
